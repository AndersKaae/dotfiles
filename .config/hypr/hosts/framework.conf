# Framework laptop + Dell U2723QE at the work desk.
# Sourced from hyprland.conf via the host.conf symlink.

# Persistent workspaces. These are deliberately NOT in the shared config: a
# persistent workspace whose monitor is absent gets parked on whichever monitor
# is present and can then never be closed, because it always has a monitor and
# is always "in use". Only bind persistent workspaces to monitors this host
# actually has.
workspace = 1, monitor:eDP-1, persistent:true
workspace = 2, monitor:desc:Dell Inc. DELL U2723QE 69M6L04, persistent:true
workspace = 3, monitor:desc:Dell Inc. DELL U2723QE 69M6L04, persistent:true

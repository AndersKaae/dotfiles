# Fallback host config, used when hosts/<hostname>.conf does not exist.
#
# Intentionally declares no persistent workspaces: workspaces are then created
# on demand and disappear when their last window closes, which is correct on any
# machine. To specialise a machine, copy this file to hosts/$(cat /etc/hostname).conf,
# add its rules, and re-run ~/.local/bin/hypr-host-link.sh.
#
# To bind persistent workspaces to a monitor, get its description from
#   hyprctl monitors all -j | jq -r '.[].description'
# and use `monitor:desc:<description>` rather than the connector name - connector
# names (DP-3 vs DP-4) change on their own when docks or cables change.

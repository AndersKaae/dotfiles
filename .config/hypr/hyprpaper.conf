# An empty `monitor =` applies the wallpaper to every output, so this works on
# any machine without naming connectors. The previous per-monitor blocks pointed
# the HDMI-A-1 one at /home/anders/... , which exists on neither machine.
wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/lucas-k-R79qkPYvrcM-unsplash.jpg
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Globe Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a14 75%, #000 100%);
    color: #fff;
    font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; cursor: grab;
  }
  body.dragging { cursor: grabbing; }

  #scene {
    perspective: 1400px;
    perspective-origin: 50% 50%;
    width: 100%; height: 100%;
    position: relative;
  }
  #globe {
    position: absolute;
    left: 50%; top: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .icon {
    position: absolute;
    left: -32px; top: -32px;
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .icon img {
    width: 48px; height: 48px;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
  }
  .icon .label {
    position: absolute;
    top: 56px;
    font-size: 11px;
    white-space: nowrap;
    background: rgba(0,0,0,0.75);
    padding: 3px 8px;
    border-radius: 5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    backdrop-filter: blur(4px);
  }
  .icon:hover { filter: brightness(1.5) drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
  .icon:hover .label { opacity: 1; }
  .icon.dim { opacity: 0.12; pointer-events: none; }

  #search {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 20, 35, 0.7);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    min-width: 320px;
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  #search:focus { border-color: rgba(140, 160, 255, 0.6); }

  #hint {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; color: #666;
    letter-spacing: 0.5px;
    z-index: 10;
  }
</style>
</head>
<body>
<input id="search" placeholder="filter…" autocomplete="off" autofocus>
<div id="scene"><div id="globe"></div></div>
<div id="hint">drag to rotate · scroll to zoom · click to launch · esc to close</div>

<script>
const globe = document.getElementById('globe');
const search = document.getElementById('search');

let R = Math.min(window.innerWidth, window.innerHeight) * 0.34;
let apps = [];
let elements = [];

const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'>" +
  "<rect width='48' height='48' rx='10' fill='#3a3a52'/>" +
  "<text x='50%' y='58%' fill='#aaa' font-size='22' text-anchor='middle' font-family='sans-serif'>?</text></svg>"
);

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function fibonacciSphere(n) {
  const pts = [];
  if (n === 1) return [[0, 0, 1]];
  const phi = Math.PI * (Math.sqrt(5) - 1);
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = phi * i;
    pts.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
  }
  return pts;
}

async function load() {
  const r = await fetch('/apps');
  apps = await r.json();
  layout();
  requestAnimationFrame(render);
}

function layout() {
  globe.innerHTML = '';
  elements = [];
  const pts = fibonacciSphere(apps.length);
  apps.forEach((a, i) => {
    const [x, y, z] = pts[i];
    const el = document.createElement('div');
    el.className = 'icon';
    el.dataset.id = a.id;
    el.innerHTML =
      `<img src="/icon/${a.id}" onerror="this.onerror=null;this.src='${FALLBACK}'">` +
      `<span class="label">${escapeHtml(a.name)}</span>`;
    el.addEventListener('click', () => launch(a.id));
    globe.appendChild(el);
    elements.push({ el, name: a.name.toLowerCase(), x, y, z });
  });
}

let rotX = -15, rotY = 0;
let velX = 0, velY = 0.25;
let dragging = false, lastPX = 0, lastPY = 0;

function render() {
  if (!dragging) {
    rotX += velX;
    rotY += velY;
    velX *= 0.95;
    if (Math.abs(velY) > 0.25) velY *= 0.96;
  }
  // Clamp X so we don't flip
  if (rotX > 80) rotX = 80;
  if (rotX < -80) rotX = -80;

  const rx = rotX * Math.PI / 180;
  const ry = rotY * Math.PI / 180;
  const cosX = Math.cos(rx), sinX = Math.sin(rx);
  const cosY = Math.cos(ry), sinY = Math.sin(ry);

  for (const item of elements) {
    // Rotate point by Y, then X (matches CSS rotateX(rx) rotateY(ry))
    const x = item.x, y = item.y, z = item.z;
    const x1 = x * cosY + z * sinY;
    const z1 = -x * sinY + z * cosY;
    const y2 = y * cosX - z1 * sinX;
    const z2 = y * sinX + z1 * cosX;
    // Billboard: position only, no per-axis rotation
    item.el.style.transform =
      `translate3d(${x1 * R}px, ${y2 * R}px, ${z2 * R}px)`;
    // Depth fade
    const depth = (z2 + 1) / 2; // 0 = back, 1 = front
    item.el.style.opacity = item.el.classList.contains('dim')
      ? 0.08
      : 0.25 + depth * 0.75;
    item.el.style.zIndex = Math.round(z2 * 1000);
  }
  requestAnimationFrame(render);
}

// --- Mouse interaction ---
document.body.addEventListener('mousedown', e => {
  if (e.target.closest('#search')) return;
  dragging = true;
  document.body.classList.add('dragging');
  lastPX = e.clientX; lastPY = e.clientY;
  velX = velY = 0;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  rotY += dx * 0.4;
  rotX -= dy * 0.4;
  velY = dx * 0.4;
  velX = -dy * 0.4;
  lastPX = e.clientX; lastPY = e.clientY;
});
window.addEventListener('mouseup', () => {
  dragging = false;
  document.body.classList.remove('dragging');
});

// --- Wheel zoom ---
window.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.08;
  R = Math.max(80, Math.min(600, R * factor));
}, { passive: false });

// --- Search filter ---
search.addEventListener('input', () => {
  const q = search.value.toLowerCase().trim();
  for (const item of elements) {
    if (!q || item.name.includes(q)) item.el.classList.remove('dim');
    else item.el.classList.add('dim');
  }
});

search.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLauncher();
  if (e.key === 'Enter') {
    const visible = elements.filter(i => !i.el.classList.contains('dim'));
    if (visible.length) launch(parseInt(visible[0].el.dataset.id, 10));
  }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.activeElement !== search) closeLauncher();
});

window.addEventListener('resize', () => {
  R = Math.min(window.innerWidth, window.innerHeight) * 0.34;
});

async function launch(id) {
  try {
    await fetch('/launch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
  } catch (_) {}
  window.close();
}
function closeLauncher() {
  fetch('/close', { method: 'POST' }).finally(() => window.close());
}

load();
</script>
</body>
</html>
